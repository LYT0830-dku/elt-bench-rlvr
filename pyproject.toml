[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "elt-bench-rl"
version = "0.6.1"
description = "Execution-verified, stateful ELT environments and Tinker RL recipe"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = ["duckdb>=1.4,<3", "sqlglot>=30,<31", "PyYAML>=6,<7", "httpx[socks]>=0.28,<0.29", "Jinja2==3.1.6", "cryptography>=46,<51"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.14,<1"]
snowflake = ["snowflake-connector-python>=3.17,<5"]
sources = ["psycopg[binary]>=3.2,<4", "boto3>=1.35,<2"]
audit = ["pandas>=2,<4", "numpy>=2,<3"]
report = ["matplotlib>=3.10,<4"]
training = ["tinker==0.39.2", "tinker-cookbook @ git+https://github.com/thinking-machines-lab/tinker-cookbook.git@8bf7dd6192a3f1fa64640a04ec54a7f6866bbd83"]
native-services = ["moto[s3]==5.1.18", "Flask==3.1.3", "Flask-Cors==6.0.5", "Werkzeug==3.1.9"]
native = ["elt-bench-rl[training,snowflake,sources,audit,report,native-services]"]

[project.scripts]
elt-rl = "elt_rl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
elt_rl = ["*.json", "fixtures/retail/*", "fixtures/retail/project/task/*", "fixtures/retail/elt/*.json", "fixtures/retail/dbt/*.yml", "fixtures/retail/dbt/models/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
